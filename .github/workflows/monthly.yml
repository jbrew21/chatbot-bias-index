name: monthly-run

on:
  schedule:
    # Attempt on the 1st, 2nd, and 3rd of each month at 13:23 UTC.
    # run.js exits immediately if this month's data already exists,
    # so the extra days are retries, not duplicates.
    - cron: '23 13 1 * *'
    - cron: '23 13 2 * *'
    - cron: '23 13 3 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the monthly index
        run: node src/run.js
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Render the share graphic
        run: |
          node src/make-graphic.js
          sudo apt-get install -y librsvg2-bin >/dev/null 2>&1 || true
          rsvg-convert -w 2400 data/where-chatbots-lean.svg -o data/where-chatbots-lean.png
          ls -la data/where-chatbots-lean.png
      - name: Commit results
        run: |
          git config user.name "bias-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "Monthly run $(date -u +%Y-%m)"
          git push
