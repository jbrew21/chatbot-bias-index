name: render-graphic

# Re-renders the share graphic from existing data. No API calls, no cost.
# Use after any design tweak to src/make-graphic.js.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render SVG + PNG
        run: |
          node src/make-graphic.js
          sudo apt-get install -y librsvg2-bin >/dev/null 2>&1 || true
          rsvg-convert -w 2400 data/where-chatbots-lean.svg -o data/where-chatbots-lean.png
          ls -la data/where-chatbots-lean.*
      - name: Commit graphic
        run: |
          git config user.name "bias-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "Re-render share graphic"
          git push
